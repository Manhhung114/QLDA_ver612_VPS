[server]
headless = true
maxUploadSize = 200
enableXsrfProtection = true
fileWatcherType = "none"
runOnSave = false

[runner]
fastReruns = true

[browser]
gatherUsageStats = false

[logger]
level = "warning"

[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#F4F7FC"
secondaryBackgroundColor = "#EAF2FF"
textColor = "#14213D"
