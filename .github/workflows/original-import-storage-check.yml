name: Original Import Storage Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile packaged original-source storage
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile src/qlda/runtime_core/original_import_storage.py
          python -m py_compile src/qlda/presentation/streamlit/app.py

      - name: Test exact original source archive on packaged runtime
        env:
          PYTHONPATH: src
          QLDA_STORAGE_BACKEND: local
        run: |
          python - <<'PY'
          import sys
          import types
          from unittest.mock import patch
          from qlda.runtime_core import original_import_storage as store

          class DB:
              def project(self, project_id):
                  return {"id": int(project_id), "code": "E3__NT__NT-01"}

          calls = []
          def save_bytes(token, **kwargs):
              calls.append((token, kwargs))
              return {"id": "f1", "name": kwargs["name"], "download_url": "/file/f1", "history": False}

          def list_record_files(token, **kwargs):
              return {"ok": True, "files": [{"id": "f1", "name": "BOQ.xlsx", "download_url": "/file/f1", "history": False, "modified_time": "2026-09-10T10:00:00Z"}]}

          fake = types.SimpleNamespace(save_bytes=save_bytes, list_record_files=list_record_files)
          with patch.dict(sys.modules, {"qlda.runtime_core.local_vps_backend": fake}):
              item = store.archive_original_upload(DB(), 7, "session", "BOQ", "BOQ", "BOQ.xlsx", b"ORIGINAL-BYTES")
              latest = store.latest_original_upload(DB(), 7, "session", "BOQ", "BOQ")

          assert item["stored"] is True
          assert len(calls) == 1
          token, kwargs = calls[0]
          assert token == "session"
          assert kwargs["project_code"] == "E3__NT__NT-01"
          assert kwargs["kind"] == "source"
          assert kwargs["subtype"] == "BOQ"
          assert kwargs["record_code"] == "BOQ"
          assert kwargs["content"] == b"ORIGINAL-BYTES"
          assert kwargs["upload_purpose"] == "ORIGINAL_IMPORT"
          assert latest["name"] == "BOQ.xlsx"
          print("Packaged original-source archive behavior: OK")
          PY

      - name: Verify V7.6 production wiring
        run: |
          set -euxo pipefail
          grep -Fq 'from qlda.runtime_core.original_import_storage import (' src/qlda/presentation/streamlit/app.py
          grep -Fq 'archive_original_upload as _v622_archive_original_upload' src/qlda/presentation/streamlit/app.py
          grep -Fq 'upload_purpose="ORIGINAL_IMPORT"' src/qlda/runtime_core/original_import_storage.py
          grep -Fq 'qlda.runtime_core.local_vps_backend' src/qlda/runtime_core/original_import_storage.py
          grep -Fq 'src/qlda/presentation/streamlit/app.py' Dockerfile
          grep -Fq 'src/qlda/presentation/streamlit/app.py' vps/qlda.service
          ! grep -Fq 'original_import_storage_v622.py' Dockerfile
          ! grep -Fq 'v622_original_import_patch.py' Dockerfile
          ! grep -Fq 'original_import_storage_v622.py' vps/deploy.sh
          ! grep -Fq 'v622_original_import_patch.py' vps/deploy.sh
          echo 'Original import packaged VPS storage validation: OK'
