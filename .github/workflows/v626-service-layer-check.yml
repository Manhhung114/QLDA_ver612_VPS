name: V6.26 Service Layer Check

on:
  push:
    paths:
      - 'src/qlda/**'
      - 'tests/test_v626_service_layer.py'
      - 'docs/architecture/V6.26_SERVICE_LAYER.md'
      - 'VERSION.txt'
      - '.github/workflows/v626-service-layer-check.yml'
  pull_request:
    paths:
      - 'src/qlda/**'
      - 'tests/test_v626_service_layer.py'
      - 'docs/architecture/V6.26_SERVICE_LAYER.md'
      - 'VERSION.txt'
      - '.github/workflows/v626-service-layer-check.yml'

jobs:
  service-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile service layer
        run: |
          python -m compileall -q src/qlda
          python -m py_compile tests/test_v626_service_layer.py
      - name: Run V6.26 service tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: python -m unittest discover -s tests -p 'test_v626_service_layer.py' -v
      - name: Verify V6.26-or-stronger worker boundary
        run: |
          grep -q 'get_application\|ExcelImportService' src/qlda/modules/excel/worker.py
          ! grep -q 'excel_worker_v624' src/qlda/modules/excel/worker.py
          ! grep -q 'local_vps_backend_v622' src/qlda/modules/excel/worker.py
          python - <<'PY'
          from pathlib import Path
          version = tuple(int(x) for x in Path("VERSION.txt").read_text().strip().split(".")[:2])
          assert version >= (6, 26), version
          source = Path("src/qlda/modules/excel/worker.py").read_text()
          if version >= (7, 0):
              assert "get_application" in source
              assert "from qlda.services" not in source
              assert "from qlda.infrastructure" not in source
          else:
              for name in ("ExcelImportService", "FileService", "JobService"):
                  assert name in source
          PY
