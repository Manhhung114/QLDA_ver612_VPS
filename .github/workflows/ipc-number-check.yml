name: IPC Claim Number Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<4'
      - name: Compile Claim number guard
        run: |
          python -m py_compile ipc_claim_v622.py ipc_claim_number_fix_v622.py streamlit_app.py
      - name: Test Claim number detection
        run: |
          python -m unittest tests.test_ipc_claim_number_v622 -v
          grep -Fq 'V6.22 IPC CLAIM NUMBER V1' ipc_claim_number_fix_v622.py
          grep -Fq 'install_ipc_claim_number_fix()' streamlit_app.py
          grep -Fq 'ipc_claim_number_fix_v622.py' vps/deploy.sh
