name: VPS Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile packaged QLDA source
        run: |
          python -m compileall -q src/qlda
          python -m py_compile \
            src/qlda/presentation/streamlit/app.py \
            src/qlda/presentation/upload_server.py \
            src/qlda/modules/excel/worker.py \
            src/qlda/infrastructure/native_ai.py \
            src/qlda/infrastructure/database.py

      - name: Run proven BOQ IPC VO AI regression suites
        run: |
          python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<4'
          python -m unittest discover -s tests -p 'test_boq*_v622.py' -v
          python -m unittest discover -s tests -p 'test_ipc*_v622.py' -v
          python -m unittest discover -s tests -p 'test_vo*_v622.py' -v
          python -m unittest discover -s tests -p 'test_ai_live_context_v622.py' -v
          python -m unittest discover -s tests -p 'test_gemini_resilience_v622.py' -v

      - name: Validate V7.6 packaged runtime boundary
        run: |
          set -euxo pipefail
          test -f src/qlda/runtime_core/project_store.py
          test -f src/qlda/runtime_core/project_database.py
          test -f src/qlda/runtime_core/ai_service.py
          test -f src/qlda/runtime_core/boq_multisheet.py
          test -f src/qlda/runtime_core/ipc_claim.py
          test -f src/qlda/runtime_core/vo_claim.py
          test -f src/qlda/runtime_core/legal_qlda.py
          grep -Fq 'from qlda.runtime_core.bootstrap import initialize_runtime' src/qlda/presentation/streamlit/app.py
          grep -Fq 'from qlda.runtime_core import ai_service as engine' src/qlda/infrastructure/native_ai.py
          ! grep -Fq 'legacy_import' src/qlda/infrastructure/native_ai.py
          ! grep -Fq 'legacy_import' src/qlda/infrastructure/database.py
          ! grep -Fq 'exec(_compiled_vps_app' src/qlda/presentation/streamlit/app.py
          ! grep -Fq 'base64.b64decode' src/qlda/presentation/streamlit/app.py
          ! grep -Fq 'gzip.decompress' src/qlda/presentation/streamlit/app.py

      - name: Build V7.6 Docker image
        run: |
          set -euxo pipefail
          docker build --pull -t qlda-v760-ci .
          docker image inspect qlda-v760-ci >/dev/null
          docker inspect --format='{{json .Config.Healthcheck.Test}}' qlda-v760-ci | grep -Fq '/_stcore/health'
          docker inspect --format='{{json .Config.Cmd}}' qlda-v760-ci | grep -Fq 'src/qlda/presentation/streamlit/app.py'
          docker inspect --format='{{json .Config.Env}}' qlda-v760-ci | grep -Fq 'PYTHONPATH=/app/src'

      - name: Validate packaged VPS service graph
        run: |
          set -euxo pipefail
          bash -n vps/install.sh
          bash -n vps/deploy.sh
          bash -n vps/rollback.sh
          bash -n vps/healthcheck.sh
          grep -Fq 'src/qlda/presentation/streamlit/app.py' vps/qlda.service
          grep -Fq 'PYTHONPATH=/opt/qlda/app/src' vps/qlda.service
          grep -Fq 'qlda.presentation.upload_server' vps/qlda-upload.service
          grep -Fq 'PYTHONPATH=/opt/qlda/app/src' vps/qlda-upload.service
          grep -Fq 'qlda.presentation.api.app:app' vps/qlda-api.service
          grep -Fq 'PYTHONPATH=/opt/qlda/app/src' vps/qlda-api.service
          grep -Fq 'qlda.modules.excel.worker' vps/qlda-excel-worker.service
          grep -Fq 'PYTHONPATH=/opt/qlda/app/src' vps/qlda-excel-worker.service
          grep -Fq 'proxy_set_header Upgrade' vps/nginx.conf.template
          grep -Fq 'Connection "upgrade"' vps/nginx.conf.template
          grep -Fq '/_stcore/health' vps/healthcheck.sh
          test ! -e vps/install_excel_worker_v624.sh

      - name: Verify secrets are not committed
        run: |
          set -euxo pipefail
          test ! -f .env
          test ! -f .streamlit/secrets.toml
          grep -Fq 'REPLACE_ME' .env.example
          echo 'V7.6 VPS repository validation: OK'
