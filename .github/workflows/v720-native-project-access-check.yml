name: V7.2 Native Project Access Check

on:
  push:
    branches: [main]
    paths:
      - 'src/qlda/**'
      - 'tests/test_v720_native_project_access.py'
      - 'tests/test_v710_native_adapters.py'
      - 'VERSION.txt'
      - 'docs/architecture/V7.2_NATIVE_PROJECT_ACCESS.md'
      - '.github/workflows/v720-native-project-access-check.yml'
  pull_request:
    paths:
      - 'src/qlda/**'
      - 'tests/test_v720_native_project_access.py'
      - 'tests/test_v710_native_adapters.py'
      - 'VERSION.txt'
      - 'docs/architecture/V7.2_NATIVE_PROJECT_ACCESS.md'
      - '.github/workflows/v720-native-project-access-check.yml'

jobs:
  native-project-access:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API contract dependencies
        run: python -m pip install "fastapi>=0.115,<1" "uvicorn>=0.30,<1"
      - name: Compile V7.2 package
        run: PYTHONPATH=src:. python -m compileall -q src/qlda
      - name: Run V7.2 native project access tests
        run: PYTHONPATH=src:. python -m unittest -v tests.test_v720_native_project_access
      - name: Run clean architecture regressions
        run: |
          PYTHONPATH=src:. python -m unittest -v \
            tests.test_v710_native_adapters \
            tests.test_v700_clean_architecture \
            tests.test_v627_fastapi
      - name: Verify cleanup boundary
        run: |
          test ! -e build_v621_webopt.py
          test ! -e v621_webopt_source
          grep -q 'NativeProjectAccessAdapter' src/qlda/bootstrap.py
          ! grep -q 'LegacyProjectAccessAdapter' src/qlda/infrastructure/legacy_adapters.py
