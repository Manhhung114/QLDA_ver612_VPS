name: Legal QLXD Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight legal dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Compile legal modules
        run: |
          python -m py_compile legal_documents.py legal_qlda_v622.py v622_legal_qlda_patch.py streamlit_app.py

      - name: Test no-draft expanded QLXD workflow
        run: |
          python -m unittest tests.test_legal_qlda_v622 -v

      - name: Validate production wiring
        run: |
          grep -Fq 'from v622_legal_qlda_patch import patch_legal_qlda' streamlit_app.py
          grep -Fq 'source = patch_legal_qlda(source)' streamlit_app.py
          grep -Fq 'legal_qlda_v622.py' Dockerfile
          grep -Fq 'v622_legal_qlda_patch.py' Dockerfile
