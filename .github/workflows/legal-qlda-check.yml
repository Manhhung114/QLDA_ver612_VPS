name: Legal QLXD Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight legal dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Compile packaged legal runtime
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile \
            src/qlda/runtime_core/legal_documents.py \
            src/qlda/runtime_core/legal_qlda.py \
            src/qlda/runtime_core/legal_standards_backfill.py \
            src/qlda/runtime_core/legal_pccc_backfill.py \
            src/qlda/presentation/streamlit/app.py
      - name: Test no-draft expanded QLXD and PCCC workflow
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_legal_qlda_v622 -v
      - name: Validate V7.6 packaged production wiring
        run: |
          grep -Fq 'from qlda.runtime_core.legal_qlda' src/qlda/presentation/streamlit/app.py
          test -f src/qlda/runtime_core/legal_documents.py
          test -f src/qlda/runtime_core/legal_standards_backfill.py
          test -f src/qlda/runtime_core/legal_pccc_backfill.py
          grep -Fq 'src/qlda/presentation/streamlit/app.py' Dockerfile
          ! grep -Fq 'python build_v621_webopt.py' Dockerfile
          ! grep -Fq 'legal_qlda_v622.py' Dockerfile
          ! grep -Fq 'v622_legal_qlda_patch.py' Dockerfile
