name: Multi Contractor Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build generated base source
        run: |
          python build_v621_webopt.py

      - name: Compile contractor modules
        run: |
          python -m py_compile contractor_workspace_v622.py contractor_sidebar_admin_v622.py contractor_access_control_v622.py contractor_ai_context_v622.py v622_contractor_workspace_patch.py v622_contractor_access_patch.py v622_contractor_sidebar_patch.py v622_schedule_management_patch.py

      - name: Test contractor workspace, access, project AI and schedule management
        run: |
          python -m unittest tests.test_contractor_workspace_v622 tests.test_contractor_access_control_v622 tests.test_contractor_ai_context_v622 tests.test_schedule_management_v622 -v

      - name: Validate generated Streamlit source patches
        run: |
          python - <<'PY'
          from pathlib import Path
          from v622_contractor_workspace_patch import patch_contractor_workspace
          from v622_contractor_access_patch import patch_contractor_access, PATCH_MARKER
          from v622_contractor_sidebar_patch import patch_contractor_sidebar_ui, PATCH_MARKER as SIDEBAR_PATCH_MARKER, ADMIN_UI_MARKER
          from v622_schedule_management_patch import patch_schedule_management, PATCH_MARKER as SCHEDULE_PATCH_MARKER
          source = Path('dist/streamlit_app.py').read_text(encoding='utf-8')
          patched = patch_contractor_workspace(source)
          patched = patch_contractor_access(patched)
          patched = patch_contractor_sidebar_ui(patched)
          patched = patch_schedule_management(patched)
          compile(patched, 'streamlit_app_multi_contractor.py', 'exec')
          assert PATCH_MARKER in patched
          assert SIDEBAR_PATCH_MARKER in patched
          assert ADMIN_UI_MARKER in patched
          assert SCHEDULE_PATCH_MARKER in patched
          assert '_v622_render_contractor_admin_tools(st, db, int(_master_pid), dict(_contractor_ctx))' in patched
          assert 'if _master_pid and _contractor_ctx and bool(_is_admin()):' in patched
          assert 'render_ai_assistant(_master_pid if _v622_can_view_all_contractors else pid)' in patched
          assert '_v622_render_contractor_selector' in patched
          assert '("🏢 Nhà thầu", lambda: _v622_render_contractor_management' not in patched
          assert 'approval_role=_v622_approval_role' in patched
          assert 'Chỉ xem toàn bộ nhà thầu' in patched
          assert 'Phạm vi nhà thầu' in patched
          assert 'Nhà thầu được phép' in patched
          assert '_v622_set_ai_workspace_scope' in patched
          assert '("📅 Tiến độ", lambda: render_schedule(pid))' in patched
          assert '("💰 Chi phí", lambda: render_cost_management(pid))' in patched
          assert 'render_settings(_master_pid)' in patched
          assert 'with st.expander("⚙️ Quản lý công việc", expanded=False):' in patched
          assert 'DELETE FROM tasks WHERE project_id=?' in patched
          assert 'XOA TIEN DO' in patched
          assert 'selectbox("Xóa task"' not in patched
          print('Multi-contractor sidebar/access/schedule generated UI incl. Admin controls: OK')
          PY

      - name: Validate production entrypoint wiring
        run: |
          grep -Fq 'install_contractor_workspace()' streamlit_app.py
          grep -Fq 'install_contractor_sidebar_admin()' streamlit_app.py
          grep -Fq 'install_contractor_access_control()' streamlit_app.py
          grep -Fq 'capture_single_contractor_ai_context()' streamlit_app.py
          grep -Fq 'install_contractor_ai_context()' streamlit_app.py
          grep -Fq 'install_ai_access_guard()' streamlit_app.py
          grep -Fq 'patch_contractor_workspace(source)' streamlit_app.py
          grep -Fq 'patch_contractor_access(source)' streamlit_app.py
          grep -Fq 'patch_contractor_sidebar_ui(source)' streamlit_app.py
          grep -Fq 'patch_schedule_management(source)' streamlit_app.py
          grep -Fq 'V6.22 CONTRACTOR WORKSPACE V1' contractor_workspace_v622.py
          grep -Fq 'V6.22 CONTRACTOR SIDEBAR ADMIN V1' contractor_sidebar_admin_v622.py
          grep -Fq 'V6.22 CONTRACTOR SIDEBAR FINAL UI V3 ADMIN CONTROLS' v622_contractor_sidebar_patch.py
          grep -Fq 'V6.22 CONTRACTOR SIDEBAR ADMIN INJECT V2' v622_contractor_sidebar_patch.py
          grep -Fq 'V6.22 CONTRACTOR ACCESS CONTROL V1' contractor_access_control_v622.py
          grep -Fq 'V6.22 MULTI CONTRACTOR AI V1' contractor_ai_context_v622.py
          grep -Fq 'V6.22 SCHEDULE MANAGEMENT V1' v622_schedule_management_patch.py
          grep -Fq 'IPC lớn nhất được xác định RIÊNG CHO TỪNG NHÀ THẦU' contractor_ai_context_v622.py
          grep -Fq 'PROJECT-REMAINING-ALL' contractor_ai_context_v622.py
