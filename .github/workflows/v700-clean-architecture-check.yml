name: V7.0 Clean Architecture Check

on:
  push:
    branches: [main]
    paths:
      - "src/qlda/**"
      - "tests/test_v700_clean_architecture.py"
      - "tests/test_v627_fastapi.py"
      - "tests/test_v626_service_layer.py"
      - "tests/test_v625_modular_monolith.py"
      - "docs/architecture/V7.0_CLEAN_ARCHITECTURE.md"
      - "VERSION.txt"
      - ".github/workflows/v700-clean-architecture-check.yml"
  pull_request:
    paths:
      - "src/qlda/**"
      - "tests/test_v700_clean_architecture.py"
      - "tests/test_v627_fastapi.py"
      - "tests/test_v626_service_layer.py"
      - "tests/test_v625_modular_monolith.py"
      - "docs/architecture/V7.0_CLEAN_ARCHITECTURE.md"
      - "VERSION.txt"
      - ".github/workflows/v700-clean-architecture-check.yml"

jobs:
  clean-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API contract dependencies
        run: python -m pip install "fastapi>=0.115,<1" "uvicorn>=0.30,<1"
      - name: Compile clean core
        run: PYTHONPATH=src:. python -m compileall -q src/qlda
      - name: Test V7 dependency rule
        run: PYTHONPATH=src:. python -m unittest -v tests.test_v700_clean_architecture
      - name: Verify legacy regressions remain compatible
        run: |
          PYTHONPATH=src:. python -m unittest -v tests.test_v625_modular_monolith
          PYTHONPATH=src:. python -m unittest -v tests.test_v626_service_layer
          PYTHONPATH=src:. python -m unittest -v tests.test_v627_fastapi
      - name: Enforce outer adapter boundary
        run: |
          ! grep -R "qlda.services" src/qlda/presentation/api src/qlda/modules/excel/worker.py
          ! grep -R "qlda.shared.legacy" src/qlda/presentation/api src/qlda/application src/qlda/domain
          ! grep -R "qlda.infrastructure" src/qlda/application src/qlda/domain
          grep -q "qlda.services" src/qlda/infrastructure/legacy_adapters.py
          PYTHONPATH=src:. python - <<'PY'
          import qlda
          version = tuple(int(x) for x in qlda.__version__.split('.')[:2])
          assert version >= (7, 0), qlda.__version__
          assert qlda.ARCHITECTURE == 'clean-architecture', qlda.ARCHITECTURE
          assert qlda.CLEAN_CORE is True
          PY
