name: V7.5 Native Import Engines Check

on:
  push:
    branches: [main]
    paths:
      - 'src/qlda/**'
      - 'tests/test_v750_native_import_engines.py'
      - 'tests/test_v740_native_excel.py'
      - 'tests/test_v626_service_layer.py'
      - 'tests/test_v625_modular_monolith.py'
      - 'VERSION.txt'
      - 'docs/architecture/V7.5_NATIVE_IMPORT_ENGINES.md'
      - '.github/workflows/v750-native-import-engines-check.yml'
  pull_request:
    paths:
      - 'src/qlda/**'
      - 'tests/test_v750_native_import_engines.py'
      - 'tests/test_v740_native_excel.py'
      - 'tests/test_v626_service_layer.py'
      - 'tests/test_v625_modular_monolith.py'
      - 'VERSION.txt'
      - 'docs/architecture/V7.5_NATIVE_IMPORT_ENGINES.md'
      - '.github/workflows/v750-native-import-engines-check.yml'

jobs:
  native-import-engines:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract dependencies
        run: python -m pip install "fastapi>=0.115,<1" "uvicorn>=0.30,<1" "openpyxl>=3.1,<4"
      - name: Compile V7.5 package
        run: PYTHONPATH=src:. python -m compileall -q src/qlda
      - name: Run V7.5 tests
        run: PYTHONPATH=src:. python -m unittest -v tests.test_v750_native_import_engines
      - name: Run architecture regressions
        run: |
          PYTHONPATH=src:. python -m unittest -v \
            tests.test_v740_native_excel \
            tests.test_v730_native_ai \
            tests.test_v720_native_project_access \
            tests.test_v710_native_adapters \
            tests.test_v700_clean_architecture \
            tests.test_v626_service_layer \
            tests.test_v625_modular_monolith \
            tests.test_v627_fastapi
      - name: Enforce V7.5 retirement boundary
        run: |
          test -d src/qlda/import_engines
          test ! -d src/qlda/services
          test ! -e src/qlda/modules/boq
          test ! -e src/qlda/modules/ipc
          test ! -e src/qlda/modules/vo
          test ! -e src/qlda/modules/schedule
          test ! -e src/qlda/modules/excel/jobs.py
          test ! -e src/qlda/shared/legacy.py
          ! grep -Eq '^[[:space:]]*(from|import)[[:space:]]+qlda\.runtime' src/qlda/infrastructure/native_excel.py
          grep -q 'V7.5 NATIVE IMPORT ENGINE WORKER' src/qlda/modules/excel/worker.py
          PYTHONPATH=src:. python - <<'PY'
          import ast
          from pathlib import Path
          import qlda
          source = Path('src/qlda/infrastructure/native_excel.py').read_text()
          tree = ast.parse(source)
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(a.name for a in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module)
          assert 'qlda.runtime' not in imports, imports
          assert not any(x == 'qlda.services' or x.startswith('qlda.services.') for x in imports), imports
          assert qlda.__version__ == '7.5', qlda.__version__
          assert qlda.IMPORT_ENGINE_LAYER == 'native-packaged'
          assert qlda.LEGACY_ADAPTERS == ()
          PY
