name: V6.25 Modular Monolith Check

on:
  push:
    paths:
      - 'src/qlda/**'
      - 'tests/test_v625_modular_monolith.py'
      - 'docs/architecture/V6.25_MODULAR_MONOLITH.md'
      - 'vps/qlda-excel-worker.service'
      - 'vps/qlda.service'
      - 'vps/install_excel_worker_v624.sh'
      - 'Dockerfile'
      - 'VERSION.txt'
      - 'CHANGELOG.md'
      - '.github/workflows/v625-modular-monolith-check.yml'
  pull_request:
    paths:
      - 'src/qlda/**'
      - 'tests/test_v625_modular_monolith.py'
      - 'docs/architecture/V6.25_MODULAR_MONOLITH.md'
      - 'vps/qlda-excel-worker.service'
      - 'vps/qlda.service'
      - 'vps/install_excel_worker_v624.sh'
      - 'Dockerfile'
      - 'VERSION.txt'
      - 'CHANGELOG.md'
      - '.github/workflows/v625-modular-monolith-check.yml'

jobs:
  modular-monolith:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile modular package
        run: |
          python -m compileall -q src/qlda
          python -m py_compile tests/test_v625_modular_monolith.py
      - name: Run architecture boundary tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: python -m unittest -v tests.test_v625_modular_monolith
      - name: Verify production entrypoints
        run: |
          grep -q 'PYTHONPATH=/opt/qlda/app/src:/opt/qlda/app' vps/qlda.service
          grep -q 'PYTHONPATH=/opt/qlda/app/src:/opt/qlda/app' vps/qlda-excel-worker.service
          grep -q -- '-m qlda.modules.excel.worker --poll-seconds 2' vps/qlda-excel-worker.service
          grep -q 'PYTHONPATH=/app/src:/app' Dockerfile
          test "$(tr -d '\r\n ' < VERSION.txt)" = '6.25'
