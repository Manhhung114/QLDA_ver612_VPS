name: UI V7 Compact Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build generated base source
        run: |
          python build_v621_webopt.py

      - name: Compile V7 UI layer
        run: |
          python -m py_compile ui_v7_compact_v622.py v622_ui_v7_compact_patch.py vn_datetime_v622.py work_tasks_v1_v622.py contract_management_v622.py streamlit_app.py

      - name: Test V7 compact source patch
        run: |
          python -m unittest tests.test_ui_v7_compact_v622 tests.test_vn_datetime_v622 tests.test_contract_management_v622 -v
          grep -Fq 'patch_ui_v7_compact(source)' streamlit_app.py
          grep -Fq 'by: Hoàng Mạnh Hùng &amp; AI' ui_v7_compact_v622.py
          grep -Fq 'V7 COMPACT UI SOURCE PATCH V6 CONTRACT MANAGEMENT' v622_ui_v7_compact_patch.py
          grep -Fq '📋 Công việc' v622_ui_v7_compact_patch.py
          grep -Fq 'render_work_tasks_v1' v622_ui_v7_compact_patch.py
          grep -Fq '📑 Quản lý hợp đồng' v622_ui_v7_compact_patch.py
          grep -Fq 'can_access_contract_management(_v7_identity)' v622_ui_v7_compact_patch.py
          grep -Fq 'install_vn_datetime_policy_v7(st)' v622_ui_v7_compact_patch.py
          grep -Fq 'install_caption_policy_v7(st)' v622_ui_v7_compact_patch.py
          grep -Fq 'render_admin_caption_toggle_v7(st, bool(_is_admin()))' v622_ui_v7_compact_patch.py
          grep -Fq 'color:#000000;' ui_v7_compact_v622.py
          grep -Fq 'content:"🌍";' ui_v7_compact_v622.py
          grep -Fq 'qlda-v7-globe-spin' ui_v7_compact_v622.py
          grep -Fq 'Asia/Ho_Chi_Minh' vn_datetime_v622.py
          grep -Fq '✏️ Thêm / sửa BOQ' v622_ui_v7_compact_patch.py
          grep -Fq '⟳ Cập nhật kho văn bản' v622_ui_v7_compact_patch.py
