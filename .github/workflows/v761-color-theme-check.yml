name: V7.6.1 Color Theme Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  color-theme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply packaged V7 color palette once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/qlda/runtime_core/ui_v7_compact.py')
          text = path.read_text(encoding='utf-8')
          marker = 'V7.6 UI COLOR PALETTE 2026'
          if marker not in text:
              needle = '</style>\n<div class="qlda-v7-credit">'
              if needle not in text:
                  raise SystemExit('Cannot locate V7 theme closing style block')
              css = r'''

/* V7.6 UI COLOR PALETTE 2026
   Presentation-only overrides. Keep business/data logic untouched. */
:root {
  --qlda-primary: #2563eb;
  --qlda-primary-strong: #1d4ed8;
  --qlda-cyan: #0891b2;
  --qlda-purple: #7c3aed;
  --qlda-teal: #0f766e;
  --qlda-orange: #ea580c;
  --qlda-soft-blue: #eff6ff;
  --qlda-soft-cyan: #ecfeff;
  --qlda-soft-purple: #f5f3ff;
  --qlda-soft-green: #ecfdf3;
  --qlda-shadow: 0 8px 24px rgba(30, 64, 175, .08);
}

/* Overall canvas: subtle color, still optimized for long engineering tables. */
.stApp {
  background:
    radial-gradient(circle at 92% 2%, rgba(14,165,233,.09), transparent 25rem),
    radial-gradient(circle at 8% 98%, rgba(124,58,237,.055), transparent 28rem),
    linear-gradient(180deg, #f8fbff 0%, #f5f7fb 58%, #f8fafc 100%);
}

/* Sidebar keeps high readability but no longer looks flat grey. */
[data-testid="stSidebar"] {
  background: linear-gradient(180deg, #eaf3ff 0%, #f4f8ff 52%, #eef8fb 100%) !important;
  border-right: 1px solid #c9d9ee !important;
  box-shadow: 5px 0 18px rgba(37,99,235,.045);
}
[data-testid="stSidebar"] h1,
[data-testid="stSidebar"] h2,
[data-testid="stSidebar"] h3 {
  color: #153a66 !important;
}
[data-testid="stSidebar"] [data-testid="stExpander"] {
  background: rgba(255,255,255,.72);
  border-color: #cbdcf0;
}

/* Header / overview cards get gentle brand gradients. */
.qlda-v7-hero {
  background: linear-gradient(120deg, #ffffff 0%, #eef6ff 46%, #f4f1ff 100%) !important;
  border-color: #c8d8ef !important;
  box-shadow: var(--qlda-shadow) !important;
  position: relative;
  overflow: hidden;
}
.qlda-v7-hero::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 5px;
  background: linear-gradient(180deg, var(--qlda-primary), var(--qlda-cyan), var(--qlda-purple));
}
.qlda-v7-title {
  color: #153a66 !important;
  letter-spacing: .015em;
}
.qlda-v7-badge {
  background: linear-gradient(135deg, #e0ecff, #e8f8ff) !important;
  color: #174a8b !important;
  border: 1px solid #bcd4f5;
}
.qlda-v7-section-title {
  color: #164e82 !important;
  border-left: 4px solid var(--qlda-cyan);
  padding-left: 9px;
}

/* Metrics: visually separate key operational numbers. */
[data-testid="stMetric"] {
  background: linear-gradient(145deg, #ffffff 0%, #f6faff 100%) !important;
  border-color: #d2e0f2 !important;
  border-top: 3px solid #4f8ee8 !important;
  box-shadow: 0 5px 18px rgba(37,99,235,.065) !important;
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
[data-testid="stMetric"]:hover {
  transform: translateY(-1px);
  border-color: #9fc1ef !important;
  box-shadow: 0 9px 22px rgba(37,99,235,.11) !important;
}
[data-testid="stMetricValue"] { color: #174a8b !important; }
[data-testid="stMetricDelta"] { font-weight: 650; }

/* Tabs: selected section is immediately visible. */
[data-baseweb="tab-list"] {
  gap: 4px;
  background: rgba(232,240,252,.72);
  border: 1px solid #d5e1f1;
  border-radius: 12px;
  padding: 4px 5px;
}
[data-baseweb="tab"] {
  border-radius: 9px !important;
  color: #475569 !important;
  font-weight: 600 !important;
}
[data-baseweb="tab"][aria-selected="true"] {
  color: #164e82 !important;
  background: linear-gradient(135deg, #ffffff, #eaf4ff) !important;
  box-shadow: 0 2px 8px rgba(37,99,235,.10);
}
[data-baseweb="tab-highlight"] { background-color: var(--qlda-primary) !important; }

/* Buttons: primary actions pop; secondary actions remain calm. */
.stButton > button,
.stDownloadButton > button,
.stLinkButton > a,
.stFormSubmitButton > button {
  border: 1px solid #b9cce5 !important;
  background: linear-gradient(180deg, #ffffff, #f3f7fc) !important;
  color: #164e82 !important;
  font-weight: 620 !important;
  box-shadow: 0 2px 6px rgba(30,64,175,.055);
  transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
}
.stButton > button:hover,
.stDownloadButton > button:hover,
.stLinkButton > a:hover,
.stFormSubmitButton > button:hover {
  border-color: #76a7e8 !important;
  background: linear-gradient(180deg, #f8fbff, #eaf3ff) !important;
  color: #123f73 !important;
  box-shadow: 0 5px 14px rgba(37,99,235,.12);
  transform: translateY(-1px);
}
.stButton > button[kind="primary"],
.stFormSubmitButton > button[kind="primary"] {
  background: linear-gradient(135deg, var(--qlda-primary-strong), var(--qlda-primary), var(--qlda-cyan)) !important;
  color: #ffffff !important;
  border-color: transparent !important;
  box-shadow: 0 5px 14px rgba(37,99,235,.23) !important;
}
.stButton > button[kind="primary"]:hover,
.stFormSubmitButton > button[kind="primary"]:hover {
  filter: brightness(1.04);
  box-shadow: 0 7px 18px rgba(37,99,235,.29) !important;
}

/* Inputs and selectors receive a visible, accessible focus state. */
[data-baseweb="input"] > div,
[data-baseweb="select"] > div,
[data-baseweb="textarea"] > div,
[data-baseweb="base-input"] {
  border-color: #c7d5e7 !important;
  background-color: rgba(255,255,255,.96) !important;
}
[data-baseweb="input"] > div:focus-within,
[data-baseweb="select"] > div:focus-within,
[data-baseweb="textarea"] > div:focus-within,
[data-baseweb="base-input"]:focus-within {
  border-color: #5c9bea !important;
  box-shadow: 0 0 0 3px rgba(37,99,235,.11) !important;
}

/* Forms, expanders and editable grids use consistent card treatment. */
[data-testid="stForm"],
[data-testid="stExpander"] {
  border-color: #d3dfef !important;
  box-shadow: 0 3px 12px rgba(30,64,175,.045);
}
[data-testid="stDataFrame"],
[data-testid="stDataEditor"] {
  border-color: #cad9eb !important;
  box-shadow: 0 4px 14px rgba(30,64,175,.055);
}
[data-testid="stDataFrame"] [role="columnheader"],
[data-testid="stDataEditor"] [role="columnheader"] {
  background: #edf5ff !important;
  color: #173f70 !important;
  font-weight: 700 !important;
}

/* Alert blocks retain semantic colors but are softened for long sessions. */
[data-testid="stAlert"] {
  border-radius: 11px !important;
  box-shadow: 0 2px 8px rgba(15,23,42,.045);
}
.qlda-v7-actions {
  background: linear-gradient(135deg, #ffffff 0%, #fffaf5 100%) !important;
  border-color: #ecd7c3 !important;
  box-shadow: 0 3px 12px rgba(234,88,12,.055);
}
.qlda-v7-chip {
  background: #fff4e8 !important;
  border-color: #f0c89f !important;
  color: #9a4309 !important;
  font-weight: 600;
}
.qlda-v7-chip.good {
  background: var(--qlda-soft-green) !important;
  border-color: #b8e3c8 !important;
  color: #126b3a !important;
}

/* Toggles / checkboxes / progress bars follow the same brand family. */
[data-testid="stProgress"] > div > div > div > div {
  background: linear-gradient(90deg, var(--qlda-primary), var(--qlda-cyan)) !important;
}
[data-baseweb="checkbox"] [aria-checked="true"] {
  background-color: var(--qlda-primary) !important;
  border-color: var(--qlda-primary) !important;
}

/* Selection color and scrollbar are small details that make the UI feel finished. */
::selection { background: #bfdbfe; color: #102a43; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #edf2f8; }
::-webkit-scrollbar-thumb { background: #b3c8e2; border-radius: 999px; border: 2px solid #edf2f8; }
::-webkit-scrollbar-thumb:hover { background: #86abd8; }

@media (max-width: 760px) {
  [data-baseweb="tab-list"] { overflow-x: auto; }
  [data-testid="stMetric"] { border-top-width: 2px !important; }
  .qlda-v7-hero::before { width: 4px; }
}
'''
              text = text.replace(needle, css + '\n</style>\n<div class="qlda-v7-credit">', 1)
              path.write_text(text, encoding='utf-8')

          test = Path('tests/test_v761_color_theme.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_packaged_v7_color_palette_is_present():\n    text = Path("src/qlda/runtime_core/ui_v7_compact.py").read_text(encoding="utf-8")\n    assert "V7.6 UI COLOR PALETTE 2026" in text\n    assert "--qlda-primary: #2563eb" in text\n    assert "--qlda-cyan: #0891b2" in text\n    assert "--qlda-purple: #7c3aed" in text\n    assert "[data-baseweb=\\\"tab\\\"][aria-selected=\\\"true\\\"]" in text\n    assert ".stButton > button[kind=\\\"primary\\\"]" in text\n    assert "[data-testid=\\\"stMetric\\\"]:hover" in text\n    assert "[data-testid=\\\"stSidebar\\\"]" in text\n\n\ndef test_palette_does_not_replace_business_module_contract():\n    text = Path("src/qlda/runtime_core/ui_v7_compact.py").read_text(encoding="utf-8")\n    assert "def install_theme_v7(st) -> None:" in text\n    assert "def render_header_v7(" in text\n    assert "def render_overview_v7(" in text\n''', encoding='utf-8')
          PY

      - name: Compile packaged UI
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile src/qlda/runtime_core/ui_v7_compact.py
          python -m py_compile src/qlda/presentation/streamlit/app.py

      - name: Test color theme and V7.6 regression
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_v761_color_theme.py
          python -m pytest -q tests/test_v760_final_conversion.py tests/test_v760_packaged_db_identifiers.py

      - name: Commit palette after green checks
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- src/qlda/runtime_core/ui_v7_compact.py tests/test_v761_color_theme.py; then
            echo 'Color palette already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/qlda/runtime_core/ui_v7_compact.py tests/test_v761_color_theme.py
          git commit -m 'ui(v7.6): enrich Streamlit color palette'
          git push origin HEAD:main
