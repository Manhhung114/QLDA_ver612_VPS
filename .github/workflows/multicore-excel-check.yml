name: Multicore Excel Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  multicore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<4' 'streamlit>=1.32'
      - name: Compile packaged multicore integration
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile \
            src/qlda/runtime_core/multicore_excel.py \
            src/qlda/runtime_core/boq_multisheet.py \
            src/qlda/runtime_core/ipc_claim.py \
            src/qlda/runtime_core/vo_claim.py
          grep -Fq 'V6.22 MULTICORE EXCEL V1' src/qlda/runtime_core/multicore_excel.py
          grep -Fq 'ProcessPoolExecutor' src/qlda/runtime_core/multicore_excel.py
          grep -Fq 'QLDA_PARALLEL_EXCEL_MIN_MB=2' Dockerfile
      - name: Test multicore BOQ IPC VO parsers
        env:
          PYTHONPATH: src
          QLDA_CPU_WORKERS: '2'
          QLDA_PARALLEL_EXCEL_MIN_MB: '0'
          QLDA_PARALLEL_MIN_SHEETS: '2'
          QLDA_MP_START_METHOD: forkserver
        run: python -m unittest tests.test_multicore_excel_v622 -v
      - name: Validate four-vCPU policy
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import os
          os.environ['QLDA_CPU_WORKERS'] = '3'
          from qlda.runtime_core.multicore_excel import configured_child_workers, cpu_count
          workers = configured_child_workers()
          print({'ci_cpu_count': cpu_count(), 'configured_child_workers': workers})
          assert workers >= 1
          PY
      - name: Validate packaged deploy contract
        run: |
          bash -n vps/deploy.sh
          grep -Fq 'PYTHONPATH="$APP_DIR/src"' vps/deploy.sh
          ! grep -Fq 'multicore_excel_v622.py' vps/deploy.sh
