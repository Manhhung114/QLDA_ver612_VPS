name: Retire runtime_core AI compatibility

on:
  push:
    branches:
      - ai/retire-runtime-core-compat
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retire-runtime-ai:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src:.
      QLDA_AI_TELEMETRY_ENABLED: '0'
      QLDA_AI_TEXT_PLANNER_FALLBACK: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/retire-runtime-core-compat
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check 'pytest>=8,<9'
      - name: Apply one-shot retirement migration
        run: python scripts/retire_runtime_core_ai.py
      - name: Compile migrated source
        run: |
          python -m compileall -q src/qlda
          python -m py_compile src/qlda/presentation/streamlit/app.py
      - name: Run native AI quality gate
        run: |
          python -m pytest -q \
            tests/test_ai_architecture_boundary.py \
            tests/test_ai_modernization.py \
            tests/test_ai_planner_native_contract.py \
            tests/test_ai_quality_eval.py \
            tests/test_ai_workspace_indexer.py \
            tests/test_ai_contractor_tenant_isolation.py \
            tests/test_ai_native_retirement.py
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit successful retirement
        run: |
          rm -f scripts/retire_runtime_core_ai.py .github/workflows/retire-runtime-ai.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'refactor(ai): delete runtime_core AI compatibility'
          git push origin HEAD:ai/retire-runtime-core-compat
