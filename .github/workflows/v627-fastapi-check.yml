name: V6.27 FastAPI Check

on:
  push:
    branches: [main]
    paths:
      - "src/qlda/**"
      - "tests/test_v627_fastapi.py"
      - "requirements.txt"
      - "VERSION.txt"
      - "vps/qlda-api.service"
      - "vps/reconcile_api_v627.sh"
      - "vps/nginx.conf.template"
      - ".github/workflows/v627-fastapi-check.yml"
  pull_request:
    paths:
      - "src/qlda/**"
      - "tests/test_v627_fastapi.py"
      - "requirements.txt"
      - "VERSION.txt"
      - "vps/qlda-api.service"
      - "vps/reconcile_api_v627.sh"
      - "vps/nginx.conf.template"
      - ".github/workflows/v627-fastapi-check.yml"

jobs:
  v627-fastapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "uvicorn>=0.30,<1"
      - name: Compile modular package
        run: PYTHONPATH=src:. python -m compileall -q src/qlda
      - name: Test API boundaries and routes
        run: PYTHONPATH=src:. python -m unittest -v tests.test_v627_fastapi
      - name: Check VPS API wiring
        run: |
          grep -q "qlda.presentation.api.app:app" vps/qlda-api.service
          grep -q "location /api/" vps/nginx.conf.template
          grep -q "/api/health" vps/reconcile_api_v627.sh
