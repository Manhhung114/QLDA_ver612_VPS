name: V7.3 Native AI Check

on:
  push:
    branches: [main]
    paths:
      - 'src/qlda/**'
      - 'tests/test_v730_native_ai.py'
      - 'tests/test_v720_native_project_access.py'
      - 'tests/test_v710_native_adapters.py'
      - 'tests/test_v700_clean_architecture.py'
      - 'tests/test_v626_service_layer.py'
      - 'tests/test_v627_fastapi.py'
      - 'VERSION.txt'
      - 'docs/architecture/V7.3_NATIVE_AI.md'
      - '.github/workflows/v730-native-ai-check.yml'
  pull_request:
    paths:
      - 'src/qlda/**'
      - 'tests/test_v730_native_ai.py'
      - 'tests/test_v720_native_project_access.py'
      - 'tests/test_v710_native_adapters.py'
      - 'tests/test_v700_clean_architecture.py'
      - 'tests/test_v626_service_layer.py'
      - 'tests/test_v627_fastapi.py'
      - 'VERSION.txt'
      - 'docs/architecture/V7.3_NATIVE_AI.md'
      - '.github/workflows/v730-native-ai-check.yml'

jobs:
  native-ai:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API contract dependencies
        run: python -m pip install "fastapi>=0.115,<1" "uvicorn>=0.30,<1"
      - name: Compile V7.3 package
        run: PYTHONPATH=src:. python -m compileall -q src/qlda
      - name: Run V7.3 native AI tests
        run: PYTHONPATH=src:. python -m unittest -v tests.test_v730_native_ai
      - name: Run architecture regressions
        run: |
          PYTHONPATH=src:. python -m unittest -v \
            tests.test_v720_native_project_access \
            tests.test_v710_native_adapters \
            tests.test_v700_clean_architecture \
            tests.test_v626_service_layer \
            tests.test_v627_fastapi
      - name: Enforce native AI boundary
        run: |
          test ! -e src/qlda/services/ai.py
          test ! -e src/qlda/services/access.py
          grep -q 'NativeAIAdapter' src/qlda/bootstrap.py
          test -f src/qlda/infrastructure/native_ai.py
          ! grep -q 'LegacyAIAdapter' src/qlda/infrastructure/legacy_adapters.py
          grep -q 'LegacyExcelImportAdapter' src/qlda/infrastructure/legacy_adapters.py
          ! grep -Eq '^[[:space:]]*(from|import)[[:space:]]+qlda\.services' src/qlda/infrastructure/native_ai.py
          ! grep -Eq '^[[:space:]]*(from|import)[[:space:]]+qlda\.shared\.legacy' src/qlda/infrastructure/native_ai.py
          PYTHONPATH=src:. python - <<'PY'
          import qlda
          version = tuple(int(x) for x in qlda.__version__.split('.')[:2])
          assert version >= (7, 3), qlda.__version__
          assert qlda.LEGACY_ADAPTERS == ('excel',), qlda.LEGACY_ADAPTERS
          PY
