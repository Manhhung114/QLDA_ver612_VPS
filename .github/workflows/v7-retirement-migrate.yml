name: V7 Repository Retirement Migration

on:
  push:
    branches: [main]
    paths:
      - 'tools/retire_legacy_v7.py'
      - 'tools/retirement_test_cleanup.py'
      - '.github/workflows/v7-retirement-migrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install migration tooling
        run: python -m pip install --disable-pip-version-check pip-tools
      - name: Retire duplicate V6/root sources and migrate tests/CI
        run: python tools/retire_legacy_v7.py
      - name: Normalize remaining patch-era tests
        run: python tools/retirement_test_cleanup.py
      - name: Generate reproducible dependency lock
        run: pip-compile --resolver=backtracking --strip-extras --output-file=requirements.lock requirements.txt
      - name: Install system runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-jre-headless
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Compile packaged V7 source
        run: python -m compileall -q src/qlda tests
      - name: Run native repository contract
        run: python tests/test_v7_repository_contract.py -v
      - name: Run full migrated regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and verify non-root Docker image
        run: |
          docker build -t qlda-v7-retirement .
          test "$(docker image inspect qlda-v7-retirement --format '{{.Config.User}}')" = "qlda"
          docker run --rm --entrypoint python qlda-v7-retirement -c "import qlda; assert qlda.LEGACY_RUNTIME is False; print(qlda.__version__)"
      - name: Commit V7-only repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No retirement changes.'
            exit 0
          fi
          git commit -m 'refactor(v7): retire duplicate V6 runtime and align CI with production'
          git push origin HEAD:main
