name: V7.4 Native Excel Import Check

on:
  push:
    branches: [main]
    paths:
      - 'src/qlda/**'
      - 'tests/test_v740_native_excel.py'
      - 'tests/test_v730_native_ai.py'
      - 'tests/test_v720_native_project_access.py'
      - 'tests/test_v710_native_adapters.py'
      - 'tests/test_v700_clean_architecture.py'
      - 'tests/test_v626_service_layer.py'
      - 'tests/test_v627_fastapi.py'
      - 'VERSION.txt'
      - 'docs/architecture/V7.4_NATIVE_EXCEL_IMPORT.md'
      - '.github/workflows/v740-native-excel-check.yml'
  pull_request:
    paths:
      - 'src/qlda/**'
      - 'tests/test_v740_native_excel.py'
      - 'tests/test_v730_native_ai.py'
      - 'tests/test_v720_native_project_access.py'
      - 'tests/test_v710_native_adapters.py'
      - 'tests/test_v700_clean_architecture.py'
      - 'tests/test_v626_service_layer.py'
      - 'tests/test_v627_fastapi.py'
      - 'VERSION.txt'
      - 'docs/architecture/V7.4_NATIVE_EXCEL_IMPORT.md'
      - '.github/workflows/v740-native-excel-check.yml'

jobs:
  native-excel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API contract dependencies
        run: python -m pip install "fastapi>=0.115,<1" "uvicorn>=0.30,<1"
      - name: Compile V7.4 package
        run: PYTHONPATH=src:. python -m compileall -q src/qlda
      - name: Run V7.4 native Excel tests
        run: PYTHONPATH=src:. python -m unittest -v tests.test_v740_native_excel
      - name: Run architecture regressions
        run: |
          PYTHONPATH=src:. python -m unittest -v \
            tests.test_v730_native_ai \
            tests.test_v720_native_project_access \
            tests.test_v710_native_adapters \
            tests.test_v700_clean_architecture \
            tests.test_v626_service_layer \
            tests.test_v627_fastapi
      - name: Enforce native Excel boundary
        run: |
          test -f src/qlda/infrastructure/native_excel.py
          test ! -e src/qlda/infrastructure/legacy_adapters.py
          grep -q 'NativeExcelImportAdapter' src/qlda/bootstrap.py
          ! grep -Eq '^[[:space:]]*(from|import)[[:space:]]+qlda\.services' src/qlda/infrastructure/native_excel.py
          ! grep -Eq '^[[:space:]]*(from|import)[[:space:]]+qlda\.modules' src/qlda/infrastructure/native_excel.py
          ! grep -Eq '^[[:space:]]*(from|import)[[:space:]]+qlda\.shared\.legacy' src/qlda/infrastructure/native_excel.py
          PYTHONPATH=src:. python - <<'PY'
          import qlda
          assert qlda.__version__ == '7.4', qlda.__version__
          assert qlda.LEGACY_ADAPTERS == (), qlda.LEGACY_ADAPTERS
          assert 'excel' in qlda.NATIVE_ADAPTERS
          PY
