name: Bootstrap QLDA VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap_vps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy current QLDA source and create VPS runtime files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/qlda_source
          git clone --depth 1 https://github.com/Manhhung114/QLDA_ver612.git /tmp/qlda_source

          # Copy the tested application source but keep this repository's own CI.
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            /tmp/qlda_source/ ./

          # VPS version does not use platform-specific container manifests.
          rm -f Dockerfile .dockerignore Procfile render.yaml railway.json

          mkdir -p vps .github/workflows

          cat > .gitignore <<'EOF'
          .venv/
          venv/
          __pycache__/
          *.py[cod]
          *.log
          .env
          .env.*
          !.env.example
          .streamlit/secrets.toml
          data/*.db
          data/*.sqlite*
          *.sqlite
          *.sqlite3
          backups/
          logs/
          dist/
          EOF

          cat > .env.example <<'EOF'
          # Copy to /opt/qlda/shared/qlda.env on the VPS.
          # NEVER commit real credentials to GitHub.

          # PostgreSQL
          DATABASE_URL=postgresql://USER:PASSWORD@HOST:5432/DATABASE?sslmode=require

          # Google Drive Apps Script Gateway
          QLDA_DRIVE_WEBAPP_URL=https://script.google.com/macros/s/REPLACE_ME/exec
          QLDA_DRIVE_API_TOKEN=REPLACE_ME

          # AI - choose gemini or openai
          AI_PROVIDER=gemini
          GEMINI_API_KEY=REPLACE_ME
          GEMINI_MODEL=auto
          GEMINI_WEB_SEARCH=false

          # Optional OpenAI
          OPENAI_API_KEY=
          OPENAI_MODEL=
          OPENAI_WEB_SEARCH=false

          # Optional Google Search
          GOOGLE_SEARCH_API_KEY=
          GOOGLE_SEARCH_CX=
          EOF

          cat > vps/qlda.service <<'EOF'
          [Unit]
          Description=QLDA V6.22 Streamlit VPS
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=qlda
          Group=qlda
          WorkingDirectory=/opt/qlda/app
          EnvironmentFile=/opt/qlda/shared/qlda.env
          Environment=PYTHONUNBUFFERED=1
          Environment=OPENBLAS_NUM_THREADS=1
          Environment=OMP_NUM_THREADS=1
          Environment=MKL_NUM_THREADS=1
          Environment=NUMEXPR_NUM_THREADS=1
          ExecStart=/opt/qlda/venv/bin/streamlit run /opt/qlda/app/streamlit_app.py --server.address=127.0.0.1 --server.port=8501 --server.headless=true --browser.gatherUsageStats=false
          Restart=always
          RestartSec=5
          TimeoutStopSec=30
          KillSignal=SIGINT

          # Basic hardening while retaining write access to app/shared directories.
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=full
          ReadWritePaths=/opt/qlda /var/log/qlda

          [Install]
          WantedBy=multi-user.target
          EOF

          cat > vps/nginx.conf.template <<'EOF'
          server {
              listen 80;
              listen [::]:80;
              server_name __QLDA_DOMAIN__;

              client_max_body_size 2048M;

              location / {
                  proxy_pass http://127.0.0.1:8501;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 86400;
                  proxy_send_timeout 86400;
                  proxy_buffering off;
              }

              location /_stcore/health {
                  proxy_pass http://127.0.0.1:8501/_stcore/health;
                  proxy_set_header Host $host;
              }
          }
          EOF

          cat > vps/healthcheck.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          URL="${1:-http://127.0.0.1:8501/_stcore/health}"
          curl --fail --silent --show-error --max-time 8 "$URL"
          echo
          EOF

          cat > vps/deploy.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          APP_DIR="${QLDA_APP_DIR:-/opt/qlda/app}"
          VENV_DIR="${QLDA_VENV_DIR:-/opt/qlda/venv}"
          SHARED_DIR="${QLDA_SHARED_DIR:-/opt/qlda/shared}"
          SERVICE="${QLDA_SERVICE:-qlda}"
          BRANCH="${QLDA_BRANCH:-main}"

          if [[ "${EUID}" -ne 0 ]]; then
            echo "Run with sudo: sudo $0" >&2
            exit 1
          fi

          cd "$APP_DIR"
          git fetch --prune origin "$BRANCH"
          OLD_COMMIT="$(git rev-parse HEAD)"
          NEW_COMMIT="$(git rev-parse "origin/$BRANCH")"

          if [[ "$OLD_COMMIT" == "$NEW_COMMIT" ]]; then
            echo "Already up to date: $NEW_COMMIT"
            exit 0
          fi

          echo "$OLD_COMMIT" > "$SHARED_DIR/previous_commit"
          git reset --hard "$NEW_COMMIT"

          "$VENV_DIR/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
          "$VENV_DIR/bin/python" -m py_compile \
            streamlit_app.py build_v621_webopt.py v622_auth_refresh_v4.py \
            postgres_backend_v622.py streamlit_secrets_v622.py

          systemctl restart "$SERVICE"

          ok=0
          for _ in $(seq 1 30); do
            if "$APP_DIR/vps/healthcheck.sh" >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 2
          done

          if [[ "$ok" -eq 1 ]]; then
            echo "Deploy OK: $OLD_COMMIT -> $NEW_COMMIT"
            exit 0
          fi

          echo "Health check failed. Rolling back to $OLD_COMMIT" >&2
          git reset --hard "$OLD_COMMIT"
          "$VENV_DIR/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
          systemctl restart "$SERVICE"
          sleep 3
          "$APP_DIR/vps/healthcheck.sh"
          exit 1
          EOF

          cat > vps/rollback.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          APP_DIR="${QLDA_APP_DIR:-/opt/qlda/app}"
          VENV_DIR="${QLDA_VENV_DIR:-/opt/qlda/venv}"
          SHARED_DIR="${QLDA_SHARED_DIR:-/opt/qlda/shared}"
          SERVICE="${QLDA_SERVICE:-qlda}"

          if [[ "${EUID}" -ne 0 ]]; then
            echo "Run with sudo: sudo $0" >&2
            exit 1
          fi

          PREV_FILE="$SHARED_DIR/previous_commit"
          if [[ ! -s "$PREV_FILE" ]]; then
            echo "No previous commit recorded." >&2
            exit 1
          fi

          PREV="$(cat "$PREV_FILE")"
          cd "$APP_DIR"
          git reset --hard "$PREV"
          "$VENV_DIR/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
          systemctl restart "$SERVICE"
          sleep 3
          "$APP_DIR/vps/healthcheck.sh"
          echo "Rolled back to $PREV"
          EOF

          cat > vps/install.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          REPO_URL="${QLDA_REPO_URL:-https://github.com/Manhhung114/QLDA_ver612_VPS.git}"
          DOMAIN="${1:-_}"
          APP_ROOT="/opt/qlda"
          APP_DIR="$APP_ROOT/app"
          VENV_DIR="$APP_ROOT/venv"
          SHARED_DIR="$APP_ROOT/shared"

          if [[ "${EUID}" -ne 0 ]]; then
            echo "Run with sudo: sudo bash vps/install.sh your-domain.example" >&2
            exit 1
          fi

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git curl rsync nginx default-jre-headless build-essential \
            python3 python3-venv python3-pip ca-certificates \
            certbot python3-certbot-nginx

          if ! id qlda >/dev/null 2>&1; then
            useradd --system --create-home --home-dir /home/qlda --shell /bin/bash qlda
          fi

          mkdir -p "$APP_ROOT" "$SHARED_DIR" /var/log/qlda

          if [[ ! -d "$APP_DIR/.git" ]]; then
            rm -rf "$APP_DIR"
            git clone "$REPO_URL" "$APP_DIR"
          else
            git -C "$APP_DIR" remote set-url origin "$REPO_URL"
            git -C "$APP_DIR" fetch origin main
            git -C "$APP_DIR" reset --hard origin/main
          fi

          if [[ ! -x "$VENV_DIR/bin/python" ]]; then
            python3 -m venv "$VENV_DIR"
          fi
          "$VENV_DIR/bin/python" -m pip install --upgrade pip wheel setuptools
          "$VENV_DIR/bin/python" -m pip install -r "$APP_DIR/requirements.txt"

          if [[ ! -f "$SHARED_DIR/qlda.env" ]]; then
            cp "$APP_DIR/.env.example" "$SHARED_DIR/qlda.env"
            chmod 600 "$SHARED_DIR/qlda.env"
            echo "Created $SHARED_DIR/qlda.env. Edit this file with real secrets before starting QLDA."
          fi

          chown -R qlda:qlda "$APP_ROOT" /var/log/qlda
          chmod +x "$APP_DIR/vps/"*.sh

          install -m 0644 "$APP_DIR/vps/qlda.service" /etc/systemd/system/qlda.service
          sed "s/__QLDA_DOMAIN__/$DOMAIN/g" "$APP_DIR/vps/nginx.conf.template" > /etc/nginx/sites-available/qlda
          ln -sfn /etc/nginx/sites-available/qlda /etc/nginx/sites-enabled/qlda
          rm -f /etc/nginx/sites-enabled/default

          nginx -t
          systemctl daemon-reload
          systemctl enable nginx qlda
          systemctl restart nginx

          echo
          echo "Base installation complete."
          echo "1) Edit secrets: sudo nano $SHARED_DIR/qlda.env"
          echo "2) Start app:    sudo systemctl restart qlda"
          echo "3) Check app:    sudo systemctl status qlda --no-pager"
          echo "4) Health:       sudo $APP_DIR/vps/healthcheck.sh"
          if [[ "$DOMAIN" != "_" ]]; then
            echo "5) HTTPS after DNS points to this VPS: sudo certbot --nginx -d $DOMAIN"
          fi
          EOF

          chmod +x vps/*.sh

          cat > VPS_DEPLOY.md <<'EOF'
          # QLDA V6.22 - VPS Ubuntu 24.04

          Repository này là bản thử nghiệm VPS tách riêng từ `Manhhung114/QLDA_ver612`.
          Mục tiêu: chạy QLDA bằng Streamlit trên Ubuntu 24.04 LTS, Nginx reverse proxy,
          systemd và PostgreSQL/Google Drive hiện có.

          ## 1. Cấu hình VPS khuyến nghị

          - Ubuntu 24.04 LTS
          - Tối thiểu: 2 vCPU / 4 GB RAM
          - Khuyến nghị: 4 vCPU / 8 GB RAM
          - SSD 40 GB trở lên
          - Mở cổng 22, 80 và 443. Không mở cổng 8501 ra Internet.

          ## 2. Cài lần đầu

          ```bash
          sudo apt update && sudo apt install -y git
          git clone https://github.com/Manhhung114/QLDA_ver612_VPS.git
          cd QLDA_ver612_VPS
          sudo bash vps/install.sh qlda.tenmien.vn
          ```

          Nếu chưa có domain, dùng:

          ```bash
          sudo bash vps/install.sh _
          ```

          Sau đó điền secrets:

          ```bash
          sudo nano /opt/qlda/shared/qlda.env
          sudo systemctl restart qlda
          sudo systemctl status qlda --no-pager
          sudo /opt/qlda/app/vps/healthcheck.sh
          ```

          ## 3. HTTPS

          Sau khi DNS A record của domain đã trỏ về IP VPS:

          ```bash
          sudo certbot --nginx -d qlda.tenmien.vn
          ```

          ## 4. Cập nhật bản vá từ GitHub

          ```bash
          sudo /opt/qlda/app/vps/deploy.sh
          ```

          Script sẽ fetch `main`, ghi lại commit cũ, cập nhật dependency, kiểm tra Python,
          restart `qlda.service`, health-check và tự rollback nếu bản mới không khởi động.

          Rollback thủ công:

          ```bash
          sudo /opt/qlda/app/vps/rollback.sh
          ```

          ## 5. Log và kiểm tra

          ```bash
          sudo journalctl -u qlda -f
          sudo nginx -t
          sudo systemctl status nginx --no-pager
          curl -I http://127.0.0.1:8501/_stcore/health
          ```

          ## 6. Secrets

          Secrets thật nằm ở `/opt/qlda/shared/qlda.env` và không nằm trong GitHub.
          Có thể dùng lại `DATABASE_URL`, Google Drive Gateway và AI keys của bản đang chạy,
          nhưng không copy secrets vào `.env.example` hoặc commit lên repository.

          ## 7. F5 / Refresh

          Bản VPS vẫn giữ cơ chế persistent authentication V5 hiện tại. Nginx phục vụ app
          dưới một domain HTTPS cố định, nên cookie/session browser có môi trường ổn định hơn
          Community Cloud. Sau khi VPS chạy, cần test: đăng nhập -> F5 -> Ctrl+F5 -> mở tab mới
          -> Logout -> F5. Nếu còn lỗi, sửa tiếp riêng trong repo VPS mà không ảnh hưởng bản Cloud.
          EOF

          cat > .github/workflows/vps-build-check.yml <<'EOF'
          name: VPS Build Check

          on:
            push:
              branches: [main]
            workflow_dispatch:

          jobs:
            validate:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - name: Compile core application
                  run: |
                    python -m py_compile \
                      streamlit_app.py build_v621_webopt.py v622_auth_refresh_v4.py \
                      postgres_backend_v622.py streamlit_secrets_v622.py
                    python build_v621_webopt.py
                    python - <<'PY'
                    from pathlib import Path
                    from v622_auth_refresh_v4 import patch_auth_refresh_v4
                    p = Path('dist/streamlit_app.py')
                    source = patch_auth_refresh_v4(p.read_text(encoding='utf-8'))
                    compile(source, 'streamlit_app_vps.py', 'exec')
                    print('VPS source compile: OK')
                    PY
                - name: Validate VPS scripts
                  run: |
                    bash -n vps/install.sh
                    bash -n vps/deploy.sh
                    bash -n vps/rollback.sh
                    bash -n vps/healthcheck.sh
                    grep -q '127.0.0.1:8501' vps/qlda.service
                    grep -q 'Upgrade' vps/nginx.conf.template
                    grep -q 'Connection "upgrade"' vps/nginx.conf.template
          EOF

          # Remove the one-shot bootstrap workflow from the completed repository.
          rm -f .github/workflows/bootstrap_vps.yml

      - name: Commit VPS repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Create QLDA V6.22 VPS test environment'
          git push origin HEAD:main
