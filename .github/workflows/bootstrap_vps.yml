name: Bootstrap QLDA VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap_vps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync tested QLDA V6.22 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/qlda_source
          git clone --depth 1 https://github.com/Manhhung114/QLDA_ver612.git /tmp/qlda_source

          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            /tmp/qlda_source/ ./

          # VPS repo keeps only VPS-relevant deployment files.
          rm -f Dockerfile .dockerignore Procfile render.yaml render-free.yaml railway.json
          rm -f DEPLOY_STREAMLIT_COMMUNITY_CLOUD.md packages.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Source already synchronized.'
            exit 0
          fi
          git commit -m 'Sync QLDA V6.22 application source for VPS'
          git push origin HEAD:main
