name: Debug BOQ Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug_boq_source.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build source and export BOQ context
        run: |
          python build_v621_webopt.py
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/streamlit_app.py')
          text = p.read_text(encoding='utf-8')
          lines = text.splitlines()
          needles = [
              'BOQ', 'Chi phí dự toán', 'cost_budgets', 'budget_total',
              'Dự toán', 'file_uploader', 'read_excel', 'ExcelFile',
              'sidebar_project_tools', 'Phụ lục tổng hợp giá trị'
          ]
          ranges = []
          for needle in needles:
              for i, line in enumerate(lines):
                  if needle.lower() in line.lower():
                      ranges.append((max(0, i-80), min(len(lines), i+160), needle, i+1))
          merged = []
          for a,b,needle,line_no in sorted(ranges):
              if merged and a <= merged[-1][1] + 20:
                  merged[-1][1] = max(merged[-1][1], b)
                  merged[-1][2].append((needle, line_no))
              else:
                  merged.append([a,b,[(needle,line_no)]])
          out = []
          for a,b,hits in merged:
              out.append('\n===== HITS %s | lines %d-%d =====' % (hits, a+1, b))
              out.extend(f'{j+1:05d}: {lines[j]}' for j in range(a,b))
          Path('boq_context.txt').write_text('\n'.join(out), encoding='utf-8')
          print('Wrote boq_context.txt:', len(out), 'lines')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: boq-source-context
          path: boq_context.txt
          if-no-files-found: error
          retention-days: 1
