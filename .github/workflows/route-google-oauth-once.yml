name: Route Google OAuth Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/route-google-oauth-once.yml

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Route OAuth callback to Production
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/qlda/presentation/streamlit/app.py')
          text = path.read_text(encoding='utf-8')
          marker = '# GOOGLE SHEETS OAUTH CALLBACK ROUTING\n'
          if marker not in text:
              anchor = 'with st.sidebar:\n    render_admin_caption_toggle_v7(st, bool(_is_admin()))\n'
              if anchor not in text:
                  raise SystemExit('navigation anchor not found')
              block = '''# GOOGLE SHEETS OAUTH CALLBACK ROUTING
# OAuth returns to the QLDA root URL. Force the current project navigation back
# to Thi công > Sản lượng so the production renderer can validate state and
# exchange the authorization code in the same request.
if (("code" in st.query_params and "state" in st.query_params) or "error" in st.query_params):
    st.session_state[f"qlda_v7_group_{_master_pid}"] = "🏗️ Thi công"
    st.session_state[f"qlda_v7_section_{_master_pid}_🏗️ Thi công"] = "📊 Sản lượng"

'''
              text = text.replace(anchor, block + anchor, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m compileall -q src/qlda
          git diff --check
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/qlda/presentation/streamlit/app.py
          git commit -m "route Google OAuth callback to production navigation"
          git push origin HEAD:main
