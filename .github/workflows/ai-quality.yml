name: AI Quality Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/qlda/application/ai/**'
      - 'src/qlda/infrastructure/ai/**'
      - 'src/qlda/infrastructure/native_ai.py'
      - 'src/qlda/autonomy/ai_planner.py'
      - 'src/qlda/application/contractor_data_hub/**'
      - 'src/qlda/composition/runtime_features.py'
      - 'src/qlda/presentation/streamlit/app.py'
      - 'src/qlda/runtime_core/*ai*.py'
      - 'tests/test_ai_*.py'
      - 'docs/architecture/AI_ARCHITECTURE.md'
      - 'docs/architecture/RUNTIME_CORE_MIGRATION_LEDGER.md'
      - '.github/workflows/ai-quality.yml'
  pull_request:
    paths:
      - 'src/qlda/application/ai/**'
      - 'src/qlda/infrastructure/ai/**'
      - 'src/qlda/infrastructure/native_ai.py'
      - 'src/qlda/autonomy/ai_planner.py'
      - 'src/qlda/application/contractor_data_hub/**'
      - 'src/qlda/composition/runtime_features.py'
      - 'src/qlda/presentation/streamlit/app.py'
      - 'src/qlda/runtime_core/*ai*.py'
      - 'tests/test_ai_*.py'
      - 'docs/architecture/AI_ARCHITECTURE.md'
      - 'docs/architecture/RUNTIME_CORE_MIGRATION_LEDGER.md'
      - '.github/workflows/ai-quality.yml'
  workflow_dispatch:

jobs:
  ai-quality:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src:.
      QLDA_AI_TEXT_PLANNER_FALLBACK: '0'
      QLDA_AI_TELEMETRY_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check 'pytest>=8,<9'
      - name: Compile native AI boundaries
        run: |
          python -m compileall -q \
            src/qlda/application/ai \
            src/qlda/infrastructure/ai \
            src/qlda/infrastructure/native_ai.py \
            src/qlda/autonomy/ai_planner.py \
            src/qlda/composition/runtime_features.py
      - name: Run AI architecture and deterministic quality regressions
        run: |
          python -m pytest -q \
            tests/test_ai_architecture_boundary.py \
            tests/test_ai_modernization.py \
            tests/test_ai_planner_native_contract.py \
            tests/test_ai_quality_eval.py \
            tests/test_ai_workspace_indexer.py \
            tests/test_ai_contractor_tenant_isolation.py \
            tests/test_ai_native_retirement.py
