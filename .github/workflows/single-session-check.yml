name: Single Session Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile packaged single-session runtime
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile \
            src/qlda/runtime_core/single_session.py \
            src/qlda/runtime_core/local_vps_backend.py \
            src/qlda/presentation/upload_server.py \
            src/qlda/presentation/streamlit/app.py
      - name: Test single-session security invariants
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_single_session_v622 -v
      - name: Syntax-check Apps Script integration
        run: |
          cp google_drive_appscript/SingleSession_V622.gs /tmp/SingleSession_V622.js
          node --check /tmp/SingleSession_V622.js
          grep -Fq "active_session_id" google_drive_appscript/SingleSession_V622.gs
          grep -Fq "action === 'list_sessions'" google_drive_appscript/SingleSession_V622.gs
          grep -Fq "action === 'force_logout'" google_drive_appscript/SingleSession_V622.gs
      - name: Validate V7.6 production wiring
        run: |
          grep -Fq 'qlda.presentation.upload_server' vps/qlda-upload.service
          grep -Fq 'src/qlda/presentation/streamlit/app.py' vps/qlda.service
          grep -Fq 'PYTHONPATH=/opt/qlda/app/src' vps/qlda-upload.service
          ! grep -Fq 'single_session_v622.py' vps/deploy.sh
          ! grep -Fq 'v622_single_session_patch.py' vps/deploy.sh
