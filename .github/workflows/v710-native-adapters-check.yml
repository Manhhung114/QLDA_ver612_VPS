name: V7.1 Native Adapters Check

on:
  push:
    branches: [main]
    paths:
      - "src/qlda/**"
      - "tests/test_v710_native_adapters.py"
      - "tests/test_v700_clean_architecture.py"
      - "tests/test_v627_fastapi.py"
      - "VERSION.txt"
      - "docs/architecture/V7.1_NATIVE_ADAPTERS.md"
      - ".github/workflows/v710-native-adapters-check.yml"
  pull_request:
    paths:
      - "src/qlda/**"
      - "tests/test_v710_native_adapters.py"
      - "tests/test_v700_clean_architecture.py"
      - "tests/test_v627_fastapi.py"
      - "VERSION.txt"
      - "docs/architecture/V7.1_NATIVE_ADAPTERS.md"
      - ".github/workflows/v710-native-adapters-check.yml"

jobs:
  native-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API contract dependencies
        run: python -m pip install "fastapi>=0.115,<1" "uvicorn>=0.30,<1"
      - name: Compile V7.1 package
        run: PYTHONPATH=src:. python -m compileall -q src/qlda
      - name: Run V7.1 native adapter tests
        run: PYTHONPATH=src:. python -m unittest -v tests.test_v710_native_adapters
      - name: Run clean architecture regressions
        run: |
          PYTHONPATH=src:. python -m unittest -v tests.test_v700_clean_architecture
          PYTHONPATH=src:. python -m unittest -v tests.test_v627_fastapi
      - name: Enforce native wiring
        run: |
          grep -q 'NativeSessionAdapter' src/qlda/bootstrap.py
          grep -q 'NativeFileAdapter' src/qlda/bootstrap.py
          grep -q 'NativeJobAdapter' src/qlda/bootstrap.py
          grep -q 'NativeSearchAdapter' src/qlda/bootstrap.py
          ! grep -q 'LegacySessionAdapter' src/qlda/infrastructure/legacy_adapters.py
          ! grep -q 'LegacyFileAdapter' src/qlda/infrastructure/legacy_adapters.py
          ! grep -q 'LegacyJobAdapter' src/qlda/infrastructure/legacy_adapters.py
          ! grep -q 'LegacySearchAdapter' src/qlda/infrastructure/legacy_adapters.py
          grep -q '^7.1$' VERSION.txt
