name: V7.6 Final Conversion Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile packaged runtime
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/qlda
          python -m py_compile src/qlda/presentation/streamlit/app.py
          python -m py_compile src/qlda/presentation/api/app.py
          python -m py_compile src/qlda/modules/excel/worker.py
      - name: V7.6 final conversion gate
        env:
          PYTHONPATH: src
        run: |
          pytest -q tests/test_v760_final_conversion.py
          pytest -q tests/test_v760_packaged_db_identifiers.py
      - name: Architecture regressions
        env:
          PYTHONPATH: src
        run: |
          pytest -q tests/test_v700_clean_architecture.py
          pytest -q tests/test_v710_native_adapters.py
          pytest -q tests/test_v720_native_project_access.py
          pytest -q tests/test_v730_native_ai.py
          pytest -q tests/test_v740_native_excel.py
          pytest -q tests/test_v750_native_import_engines.py
      - name: Shell syntax and packaged entrypoint audit
        run: |
          bash -n vps/deploy.sh
          bash -n vps/rollback.sh
          bash -n vps/install.sh
          bash -n vps/reconcile_api.sh
          grep -q '^7.6$' VERSION.txt
          ! test -e src/qlda/runtime.py
          ! test -e vps/install_excel_worker_v624.sh
          ! test -e .github/workflows/excel-v624-check.yml
          grep -q 'src/qlda/presentation/streamlit/app.py' Dockerfile
          grep -q 'src/qlda/presentation/streamlit/app.py' vps/qlda.service
          grep -q 'qlda.presentation.api.app:app' vps/qlda-api.service
          grep -q 'qlda.modules.excel.worker' vps/qlda-excel-worker.service
          grep -q 'qlda.presentation.upload_server' vps/qlda-upload.service
          grep -q 'validate_packaged_target' vps/rollback.sh
          grep -q 'LEGACY_ADAPTERS == ()' vps/rollback.sh
          grep -q 'LEGACY_RUNTIME is False' vps/rollback.sh
          grep -q 'LEGACY_ADAPTERS == ()' vps/install.sh
          grep -q 'LEGACY_RUNTIME is False' vps/install.sh
          ! grep -q 'build_v621_webopt.py' vps/deploy.sh vps/rollback.sh vps/install.sh
          ! grep -q '_v622.py' vps/deploy.sh vps/rollback.sh vps/install.sh
          ! grep -q '_v624.py' vps/deploy.sh vps/rollback.sh vps/install.sh
          grep -q 'reconcile_api.sh' vps/deploy.sh

  retire-v6-repository:
    if: github.event_name == 'push'
    needs: final-conversion
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skip when repository is already V7-only
        id: legacy
        run: |
          if test -e streamlit_app.py || test -e build_v621_webopt.py || test -d v621_webopt_source; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install migration tooling
        if: steps.legacy.outputs.present == 'true'
        run: python -m pip install --disable-pip-version-check pip-tools
      - name: Prepare V7-only repository
        if: steps.legacy.outputs.present == 'true'
        run: |
          python tools/retire_legacy_v7.py
          python tools/retirement_test_cleanup.py
          pip-compile --resolver=backtracking --strip-extras --output-file=requirements.lock requirements.txt
      - name: Install system runtime
        if: steps.legacy.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-jre-headless
      - name: Install locked dependencies
        if: steps.legacy.outputs.present == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Compile packaged V7 source and tests
        if: steps.legacy.outputs.present == 'true'
        run: python -m compileall -q src/qlda tests
      - name: Run V7 repository contract
        if: steps.legacy.outputs.present == 'true'
        run: python tests/test_v7_repository_contract.py -v
      - name: Run full migrated regression suite
        if: steps.legacy.outputs.present == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and verify non-root Docker image
        if: steps.legacy.outputs.present == 'true'
        run: |
          docker build -t qlda-v7-retirement .
          test "$(docker image inspect qlda-v7-retirement --format '{{.Config.User}}')" = 'qlda'
          docker run --rm --entrypoint python qlda-v7-retirement -c "import qlda; assert qlda.LEGACY_RUNTIME is False; assert qlda.LEGACY_ADAPTERS == (); print(qlda.__version__)"
      - name: Commit V7-only repository
        if: steps.legacy.outputs.present == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'refactor(v7): retire duplicate V6 runtime and align CI with production'
          git push origin HEAD:main
